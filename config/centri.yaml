# Configurazione del brand e dei centri MIFIT.
# L'agente usa questi dati durante le chiamate: se cambia qualcosa, chiedi a Claude di aggiornarli.

brand:
  nome: "MIFIT"
  descrizione: "MIFIT è un centro di Personal Training, cioè di allenamento personalizzato, specializzato in postura e ricomposizione corporea."
  nome_assistente: "Vittoria"
  # Come si presenta l'agente
  ruolo_assistente: "consulente virtuale"
  # Prima frase della chiamata. {saluto} diventa "Buongiorno Maria" / "Buonasera Maria"
  # (oppure solo "Buongiorno" / "Buonasera" se il nome non è noto)
  apertura: "{saluto}, sono Vittoria, la consulente virtuale di MIFIT. La chiamo perché ha richiesto informazioni per iniziare un percorso nel nostro centro. Ha due minuti da dedicarmi per prenotare una valutazione gratuita?"
  # Come si chiama l'appuntamento che l'agente deve fissare
  nome_consulenza: "valutazione dello stato di forma"
  offerta: "una visita completamente gratuita in cui condividiamo insieme il punto di partenza e capiamo qual è il percorso giusto per la persona"
  # Domanda per capire l'obiettivo del cliente
  domanda_obiettivo: "Qual è il suo obiettivo principale: dimagrire, migliorare il tono muscolare o risolvere problemi posturali?"
  # Cosa include la valutazione, a seconda dell'obiettivo del cliente
  valutazione_per_obiettivo:
    - tipo: dimagrimento_tono
      obiettivo: "Dimagrire oppure migliorare il tono muscolare"
      spiegazione: "La valutazione comprende una bioimpedenza, cioè un esame che ci permette di valutare massa grassa, massa magra, idratazione corporea e altri parametri: così condividiamo insieme il suo punto di partenza. Poi c'è un'anamnesi con il nostro coach, in cui analizziamo passo dopo passo quali sono i suoi obiettivi da raggiungere e in che modo."
      istruzioni_messaggio: "Le ricordiamo che per effettuare correttamente la bioimpedenza dovrà essere a digiuno da almeno 2 ore e bere un bicchiere d'acqua 1 ora prima dell'appuntamento."
      # Versione breve per l'SMS di 2 ore prima
      istruzioni_sms: "Ricordi: digiuno da 2h e 1 bicchiere d'acqua 1h prima."
    - tipo: posturale
      obiettivo: "Risolvere problemi posturali (mal di schiena, dolori al collo, alle spalle, postura scorretta...)"
      spiegazione: "La valutazione comprende dei test di valutazione posturale; guardiamo insieme gli eventuali referti che ha a disposizione e facciamo un'anamnesi con il nostro posturologo, in cui analizziamo passo dopo passo come risolvere i suoi problemi e ridurre i dolori che oggi la affliggono. Quando confermi l'appuntamento, invita la persona a portare eventuali referti (radiografie, risonanze, visite)."
      istruzioni_messaggio: "Se ha referti (radiografie, risonanze, visite), li porti con sé."
    - tipo: combinata
      obiettivo: "Dimagrire o migliorare il tono muscolare E ANCHE la postura"
      spiegazione: "La valutazione comprende sia una bioimpedenza, cioè un esame che ci permette di valutare massa grassa, massa magra, idratazione corporea e altri parametri, sia dei test di valutazione posturale: ci permetteranno di condividere il suo punto di partenza e il percorso da fare insieme."
      istruzioni_messaggio: "Le ricordiamo che per effettuare correttamente la bioimpedenza dovrà essere a digiuno da almeno 2 ore e bere un bicchiere d'acqua 1 ora prima dell'appuntamento. Se ha referti (radiografie, risonanze, visite), li porti con sé."
      istruzioni_sms: "Ricordi: digiuno da 2h e 1 bicchiere d'acqua 1h prima."
  # Come si chiama la figura che segue il cliente nel centro
  professionista: "coach"
  # Come l'agente si rivolge al cliente: "lei" (formale) oppure "tu" (informale)
  registro: "lei"
  # Regole che l'agente deve sempre rispettare
  regole:
    - "Non dire MAI prezzi, costi, abbonamenti o cifre, nemmeno indicative o 'a partire da'. Se il cliente insiste, spiega che ogni percorso è personalizzato: solo dopo la valutazione gratuita possiamo capire qual è il percorso giusto e presentare un preventivo su misura."
    - "Sottolinea che la valutazione è completamente gratuita e senza impegno: solo dopo aver visto il preventivo personalizzato il cliente deciderà liberamente se iniziare un percorso con noi."
    - "Se il cliente chiede come funziona il percorso, spiega che è un allenamento personalizzato con un coach, focalizzato su postura e ricomposizione corporea, e che i dettagli si definiscono insieme durante la valutazione."
    - "Se il cliente racconta problemi fisici, dolori, infortuni, patologie o esigenze particolari, non dare consigli e non indirizzarlo dal medico: ascolta con attenzione, rassicuralo che il coach (o il posturologo, per i problemi posturali) ne terrà conto e li approfondirà con lui durante la valutazione, e riporta tutto nelle note della prenotazione."
    - "Se il cliente chiede un giorno o un orario non disponibile, non dire mai 'non è possibile': rispondi 'Nel giorno da Lei indicato le valutazioni sono al completo, abbiamo disponibilità…' e proponi subito due o tre alternative."
  timezone: "Europe/Rome"

# Messaggi di conferma e promemoria inviati al cliente dopo la prenotazione.
# Segnaposto disponibili: {nome} {data} {ora} {centro} {indirizzo} {istruzioni} {chiusura}
# Usa l'apostrofo dritto ' (non ’): così l'SMS costa meno.
messaggi:
  canali: [sms, email]
  # Promemoria del giorno prima: solo se l'appuntamento è almeno 2 giorni dopo la prenotazione
  giorno_prima_ora: "10:00"
  giorno_prima_se_almeno_giorni: 2
  # Promemoria poche ore prima (quante ore prima)
  ore_prima_quante: 2
  # Non inviare messaggi prima di quest'ora del mattino
  non_prima_delle: "08:00"
  chiusura: "Nel caso non riuscisse ad essere presente all'appuntamento, le chiediamo la gentilezza di comunicarcelo scrivendo al +39 320 172 0477. A presto"
  testo_conferma: "Gentile {nome}, le confermiamo la valutazione gratuita dello stato di forma {data} alle {ora} presso {centro} in {indirizzo}.\n{istruzioni}\n{chiusura}"
  testo_giorno_prima: "Gentile {nome}, domani, {data}, alle {ora} la aspettiamo presso {centro} in {indirizzo} per la sua valutazione gratuita dello stato di forma.\n{istruzioni}\n{chiusura}"
  testo_ore_prima: "Gentile {nome}, la aspettiamo oggi alle {ora} presso {centro} in {indirizzo} per la sua valutazione gratuita dello stato di forma.\n{istruzioni}\n{chiusura}"
  # Versioni brevi per gli SMS (un SMS contiene circa 160 caratteri).
  # Segnaposto in più: {giorno_breve} (es. mer 14/10) {indirizzo_breve} {saluto_finale} (Buona Giornata / Buona Serata)
  sms_testo_conferma: "MIFIT\n{nome}, le confermo la Valutazione Gratuita {giorno_breve} ore {ora}, presso MIFIT in {indirizzo_breve}. {saluto_finale}"
  sms_testo_giorno_prima: "MIFIT\n{nome}, le ricordo la Valutazione Gratuita di domani {giorno_breve} ore {ora}, presso MIFIT in {indirizzo_breve}. A presto"
  # {istruzioni_sms}: promemoria breve per tipo di valutazione (es. digiuno per la bioimpedenza)
  sms_testo_ore_prima: "MIFIT\n{nome}, la aspettiamo oggi alle {ora} presso MIFIT in {indirizzo_breve}. {istruzioni_sms} A presto"
  oggetto_email:
    conferma: "Conferma della sua valutazione gratuita - MIFIT"
    giorno_prima: "Promemoria: domani la sua valutazione gratuita - MIFIT"
    ore_prima: "Promemoria: oggi la sua valutazione gratuita - MIFIT"

# Fascia oraria in cui l'agente può chiamare i lead
orari_chiamate:
  giorni: [lun, mar, mer, gio, ven, sab]
  dalle: "09:00"
  alle: "20:00"

# Tentativi di chiamata se il lead non risponde (minuti di attesa prima di ogni tentativo):
# subito, dopo 2 ore, dopo 1 giorno, dopo 2 giorni
tentativi_minuti: [0, 120, 1440, 2880]

centri:
  - id: casoria
    nome: "MIFIT Casoria"
    indirizzo: "Via Eleonora Pimentel Fonseca 25, Casoria (NA)"
    # Versione corta dell'indirizzo, usata negli SMS
    indirizzo_breve: "Via E. Pimentel Fonseca 25, Casoria"
    durata_consulenza_min: 40
    posti_per_slot: 1
    orari_consulenze:
      lun: ["15:00-19:00"]
      mer: ["09:00-11:00", "17:30-20:30"]
      ven: ["16:00-20:00"]
    # ID dei moduli lead (Meta / Google) che portano a questo centro
    meta_form_ids: []
    google_form_ids: []
    # ID del Google Calendar del centro (lo aggiungiamo al passo 6)
    google_calendar_id: ""
